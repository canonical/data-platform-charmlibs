name: Weekly TICS scan

on:
  schedule:
    - cron: "0 2 * * 6" # Every Saturday 2:00 AM UTC
  workflow_dispatch:
  push:
    branches:
      - tiobe-weekly-scan

jobs:
  TICS:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create and activate virtual environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install poetry tox
          echo PATH="$PATH" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run coverage tests
        run: |
          uvx --from rust-just just unit interfaces 
          uvx --from rust-just just combine-coverage interfaces

      - name: Move results to the necessary folder for TICS
        run: |
          mkdir -p .cover
          mv interfaces/.report/coverage-all-3.10.xml .cover/cobertura.xml

      - name: Install additional dependencies for TICS
        run: |
          uv sync --active --all-groups
          # Install after otherwise sync will remove
          uv pip install flake8 pylint

      - name: TICS GitHub Action
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: data-platform-charmlibs
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          branchdir: ${{ env.GITHUB_WORKSPACE }}
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}  # zizmor: ignore[secrets-outside-env] Organization secret (does not support environments: https://github.com/orgs/community/discussions/15379)
          installTics: true
          calc: ALL
    permissions: {}
